<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1190" width="1500" height="1190" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Datenfluss der Pipeline: von der Konfiguration bis zur Auswertung</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
    <style>
      .box   { fill:#f4f6f8; stroke:#3b4a5a; stroke-width:1.3; rx:8; }
      .data  { fill:#e6f0fb; stroke:#2f6aa3; stroke-width:1.3; rx:14; }
      .ent   { fill:#fff6dd; stroke:#a67c00; stroke-width:1.3; }
      .stop  { fill:#fbe9e7; stroke:#b3402a; stroke-width:1.3; rx:8; }
      .note  { fill:#ffffff; stroke:#7a8794; stroke-width:1.1; stroke-dasharray:5 4; rx:8; }
      .panel { fill:#fbfcfd; stroke:#c9d1d9; stroke-width:1; rx:10; }
      .pt    { font-size:15px; font-weight:bold; fill:#1f2d3a; }
      .b     { font-weight:bold; fill:#1f2d3a; }
      .t     { fill:#2b3945; }
      .l     { font-size:12px; fill:#5a6773; }
      .pf    { fill:none; stroke:#3b4a5a; stroke-width:1.4; marker-end:url(#pfeil); }
      .pfs   { fill:none; stroke:#7a8794; stroke-width:1.2; stroke-dasharray:6 4; marker-end:url(#pfeil); }
    </style>
  </defs>

  <text x="40" y="30" font-size="20" font-weight="bold" fill="#1f2d3a">Israel–Palästina in europäischen und weiteren Medien: Datenfluss der Pipeline</text>
  <text x="40" y="50" class="l">Rechtecke = Verarbeitungsschritt (Code in R/ und skripte/) · Raute = Entscheidung · blau = gespeicherte Daten · rot = Abbruch / Aussetzen</text>

  <!-- Panel 1 -->
  <rect class="panel" x="25" y="62" width="1450" height="115"/>
  <text class="pt" x="40" y="84">1 Planung und Adressen</text>
  <rect class="box" x="40" y="98" width="330" height="62"/>
  <text class="b" x="55" y="120">Konfiguration (R/01)</text>
  <text class="t" x="55" y="140">54 Länder · 377 Medien · Zeiträume F1–F6 + K</text>
  <rect class="box" x="430" y="98" width="330" height="62"/>
  <text class="b" x="445" y="120">Adressen sammeln (R/14)</text>
  <text class="t" x="445" y="140">robots.txt · Sitemaps · Media Cloud · Archiv-Scraper</text>
  <rect class="box" x="820" y="98" width="300" height="62"/>
  <text class="b" x="835" y="120">Grobfilter auf Adresse und Titel</text>
  <text class="t" x="835" y="140">Stichwörter in vielen Sprachen und Schriften</text>
  <rect class="data" x="1180" y="98" width="270" height="62"/>
  <text class="b" x="1198" y="120">URL-Listen je Medium</text>
  <text class="t" x="1198" y="140">data/raw/urls/*.csv</text>
  <path class="pf" d="M370,129 L430,129"/>
  <path class="pf" d="M760,129 L820,129"/>
  <path class="pf" d="M1120,129 L1180,129"/>

  <!-- Panel 2 -->
  <rect class="panel" x="25" y="190" width="1450" height="440"/>
  <text class="pt" x="40" y="212">2 Volltexte abrufen (Scraper, ein Worker je Medium)</text>
  <path class="pf" d="M1315,160 L1315,190 L1315,200 L205,200 L205,232" />
  <rect class="box" x="40" y="232" width="330" height="72"/>
  <text class="b" x="55" y="254">Abruf je Medium (R/15, R/16)</text>
  <text class="t" x="55" y="273">Pause 0,5 s ± 20 %, mindestens robots.txt-Crawl-Delay</text>
  <text class="t" x="55" y="291">Pakete zu 200 URLs, Zustand je Medium gespeichert</text>

  <path class="pf" d="M205,304 L205,358"/>
  <polygon class="ent" points="205,358 300,408 205,458 110,408"/>
  <text class="b" x="205" y="412" text-anchor="middle">HTTP-Antwort?</text>

  <rect class="box" x="430" y="330" width="260" height="44"/>
  <text class="t" x="442" y="357">200: HTML verkleinern, gzip speichern</text>
  <rect class="box" x="430" y="385" width="260" height="44"/>
  <text class="t" x="442" y="412">404 / 410: als tot merken, überspringen</text>
  <rect class="box" x="430" y="440" width="260" height="44"/>
  <text class="t" x="442" y="467">429: 45–75 s warten, zweiter Versuch</text>
  <rect class="box" x="430" y="495" width="260" height="44"/>
  <text class="t" x="442" y="522">403 u. a.: Fehlerzähler + 1</text>
  <path class="pf" d="M300,408 L340,408 L340,352 L430,352"/>
  <path class="pf" d="M300,408 L430,407"/>
  <path class="pf" d="M300,408 L340,408 L340,462 L430,462"/>
  <path class="pf" d="M300,408 L340,408 L340,517 L430,517"/>

  <rect class="box" x="740" y="330" width="320" height="44"/>
  <text class="b" x="752" y="350">Auslesen</text>
  <text class="t" x="752" y="366">paperboy-Parser → JSON-LD → allgemeine Regeln</text>
  <path class="pf" d="M690,352 L740,352"/>
  <rect class="data" x="1110" y="330" width="340" height="44"/>
  <text class="b" x="1125" y="350">Scraper-CSV je Medium</text>
  <text class="t" x="1125" y="366">paketweise, atomar geschrieben (data/raw/scraper)</text>
  <path class="pf" d="M1060,352 L1110,352"/>

  <polygon class="ent" points="880,517 980,557 880,597 780,557"/>
  <text class="b" x="880" y="553" text-anchor="middle">≥ 10 Fehler</text>
  <text class="b" x="880" y="569" text-anchor="middle">in Folge?</text>
  <path class="pf" d="M690,517 L736,517 L736,557 L780,557"/>
  <rect class="stop" x="1040" y="535" width="330" height="44"/>
  <text class="b" x="1055" y="555">Medium 24 Stunden aussetzen</text>
  <text class="t" x="1055" y="571">Status „Sperre?“, danach neuer Versuch</text>
  <path class="pf" d="M980,557 L1040,557"/>
  <text class="l" x="995" y="549">ja</text>
  <path class="pfs" d="M880,597 L880,614 L18,614 L18,268 L40,268"/>
  <text class="l" x="890" y="609">nein: nächste URL (Schleife bis alle URLs eines Mediums geholt sind)</text>

  <rect class="note" x="40" y="500" width="280" height="62"/>
  <text class="b" x="55" y="520">Platzwächter (vor jedem Paket)</text>
  <text class="t" x="55" y="538">beide Platten prüfen; unter 2,5 GB frei</text>
  <text class="t" x="55" y="554">stoppt der Abruf, nichts wird beschädigt</text>

  <!-- Panel 3 -->
  <rect class="panel" x="25" y="642" width="1450" height="132"/>
  <text class="pt" x="40" y="664">3 Medien ohne automatischen Abruf: Export aus Nexis Uni (Nutzung mit der Universitätsbibliothek abgeklärt)</text>
  <rect class="box" x="40" y="680" width="320" height="76"/>
  <text class="b" x="55" y="702">Quellen und Treffer prüfen</text>
  <text class="t" x="55" y="721">Quellenname je Medium, Suchplan</text>
  <text class="t" x="55" y="739">Trefferzahl je Fenster F1–F6</text>
  <rect class="box" x="430" y="680" width="320" height="76"/>
  <text class="b" x="445" y="702">Export als RTF</text>
  <text class="t" x="445" y="721">je Medium und Fenster, in Paketen</text>
  <text class="t" x="445" y="739">data/raw/nexis/&lt;Medium&gt;/</text>
  <rect class="box" x="820" y="680" width="320" height="76"/>
  <text class="b" x="835" y="702">RTF → CSV und Import</text>
  <text class="t" x="835" y="721">nexis_parsen.py, b4_nexis_importieren.R</text>
  <text class="t" x="835" y="739">Zuordnung über nexis_namen</text>
  <path class="pf" d="M360,718 L430,718"/>
  <path class="pf" d="M750,718 L820,718"/>

  <!-- Panel 4 -->
  <rect class="panel" x="25" y="786" width="1450" height="180"/>
  <text class="pt" x="40" y="808">4 Import, Übersetzung, Relevanz</text>
  <path class="pf" d="M1280,374 L1280,780"/>
  <path class="pf" d="M1140,718 L1160,718 L1160,780"/>
  <path class="pf" d="M1280,780 L1280,794 L282,794 L282,846"/>
  <rect class="box" x="40" y="846" width="250" height="76"/>
  <text class="b" x="55" y="868">Import in SQLite (R/02)</text>
  <text class="t" x="55" y="887">nur neue Zeilen je Datei</text>
  <text class="t" x="55" y="905">Dubletten markieren</text>
  <rect class="box" x="340" y="846" width="270" height="76"/>
  <text class="b" x="355" y="868">Übersetzung ins Englische (R/30)</text>
  <text class="t" x="355" y="887">NLLB-200 lokal, satzweise,</text>
  <text class="t" x="355" y="905">Namensschutz, Glossar je Sender</text>
  <rect class="box" x="660" y="846" width="270" height="76"/>
  <text class="b" x="675" y="868">Qualitätsprüfung</text>
  <text class="t" x="675" y="887">Gegenprobe mit zweitem Modell,</text>
  <text class="t" x="675" y="905">Classifier markiert Auffälliges</text>
  <rect class="box" x="980" y="846" width="230" height="76"/>
  <text class="b" x="995" y="868">Relevanzfilter (R/40)</text>
  <text class="t" x="995" y="887">Grobfilter, dann fein</text>
  <text class="t" x="995" y="905">auf der englischen Fassung</text>
  <rect class="data" x="1260" y="846" width="200" height="76"/>
  <text class="b" x="1275" y="868">Analysekorpus (R/50)</text>
  <text class="t" x="1275" y="887">relevant und englisch</text>
  <text class="t" x="1275" y="905">verfügbar</text>
  <path class="pf" d="M290,884 L340,884"/>
  <path class="pf" d="M610,884 L660,884"/>
  <path class="pf" d="M930,884 L980,884"/>
  <path class="pf" d="M1210,884 L1260,884"/>

  <!-- Panel 5 -->
  <rect class="panel" x="25" y="978" width="1450" height="140"/>
  <text class="pt" x="40" y="1000">5 Auswertung und Prüfung</text>
  <path class="pf" d="M1360,922 L1360,970 L300,970 L300,1022"/>
  <rect class="box" x="40" y="1022" width="300" height="76"/>
  <text class="b" x="55" y="1044">Frames (R/55)</text>
  <text class="t" x="55" y="1063">Wörterbücher, Textbausteine entfernt,</text>
  <text class="t" x="55" y="1081">Selbstverteidigung satzweise</text>
  <rect class="box" x="390" y="1022" width="300" height="76"/>
  <text class="b" x="405" y="1044">Quellenzuschreibung (R/60)</text>
  <text class="t" x="405" y="1063">Muster Englisch/Deutsch,</text>
  <text class="t" x="405" y="1081">Gesundheitsministerium-Regel</text>
  <rect class="box" x="740" y="1022" width="330" height="76"/>
  <text class="b" x="755" y="1044">Statistik (erst am Ende)</text>
  <text class="t" x="755" y="1063">STM, Mehrebenen-Logit, Modellvergleiche</text>
  <text class="t" x="755" y="1081">skripte/live_methoden.R, a4_analyse.R</text>
  <rect class="box" x="1120" y="1022" width="330" height="76"/>
  <text class="b" x="1135" y="1044">Validierung (R/70)</text>
  <text class="t" x="1135" y="1063">Stichproben, Codierung von Hand,</text>
  <text class="t" x="1135" y="1081">Gütemaße (Relevanz, Quellen, Übersetzung)</text>
  <path class="pf" d="M340,1060 L390,1060"/>
  <path class="pf" d="M690,1060 L740,1060"/>
  <path class="pf" d="M1070,1060 L1120,1060"/>

  <text x="40" y="1150" class="l">Gesamtdokument mit Erklärungen: 02_pipeline.Rmd · Entscheidungen mit Datum und Begründung: ENTSCHEIDUNGEN.md · Regelkreise im Betrieb: abbildungen/02_betrieb_und_entscheidungen.svg</text>
</svg>
